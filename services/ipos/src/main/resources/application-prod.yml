server:
  port: 5000 #Elastic bean stalk opens port 80 and redirect to 5000 using nginx by default
  forward-headers-strategy: native
  tomcat:
    protocol-header: x-forwarded-proto
    protocol-header-https-value: https

auth:
  redirect: "https://frontend.ipos.naumansajid.com/status"

logging:
  dir: /var/app/current/logs #/var/app/current is the directory the beanstalk gives the webapp user access to
  level:
    org:
      springframework:
        security: INFO #INFO, DEBUG, TRACE
