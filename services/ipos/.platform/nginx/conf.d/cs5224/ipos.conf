location / {
    if ($request_method = 'OPTIONS') {
        if ($http_origin = "http://localhost:3000") {
            add_header 'Access-Control-Allow-Origin' 'http://localhost:3000' always;
        }

        if ($http_origin = "http://brave-desert-074ebc30f.4.azurestaticapps.net") {
                   add_header 'Access-Control-Allow-Origin' 'http://brave-desert-074ebc30f.4.azurestaticapps.net' always;
        }

        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept, Authorization, X-TESTER-REQUEST' always;
        add_header 'Access-Control-Max-Age' 1728000; # 20 days
        return 204; # Return 204 No Content for OPTIONS requests
    }
    #For testing comment
    proxy_pass          http://127.0.0.1:5000;
    proxy_http_version  1.1;

    proxy_set_header    Connection          $connection_upgrade;
    proxy_set_header    Upgrade             $http_upgrade;
    proxy_set_header    Host                $host;
    proxy_set_header    X-Real-IP           $remote_addr;
    proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;

    proxy_hide_header   Access-Control-Allow-Origin;
    proxy_hide_header   Access-Control-Allow-Methods;
    proxy_hide_header   Access-Control-Allow-Headers;


    add_header 'Access-Control-Allow-Origin' 'http://localhost:3000' always;
    add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept, Authorization, X-TESTER-REQUEST' always;
}